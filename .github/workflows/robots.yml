name: "Fetch and save robots.txt"

# Pulls the community AI-crawler blocklist weekly so robots.txt stays current
# without manual upkeep. Source: https://github.com/ai-robots-txt/ai.robots.txt

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 1' # Mondays

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update robots.txt
        run: |
          # Upstream replaces the file wholesale, so our own directives have to
          # be re-appended every run or they silently vanish the next Monday.
          # Staged through a temp file so a failed fetch leaves robots.txt alone
          # rather than truncating it.
          curl -fsSL https://raw.githubusercontent.com/ai-robots-txt/ai.robots.txt/refs/heads/main/robots.txt > upstream-robots.txt
          {
            cat upstream-robots.txt
            echo
            echo "# Everything not named above. Crawlers match the most specific"
            echo "# user-agent group, so the blocklist still wins for those."
            echo "User-agent: *"
            echo "Allow: /"
            echo
            echo "Sitemap: https://badhrinadh.com/sitemap.xml"
          } > robots.txt
          rm upstream-robots.txt
          git config user.email "bot@badhrinadh.com"
          git config user.name "guardian [bot]"
          git add robots.txt
          git commit -m "Update robots.txt" || echo "Nothing changed"
          git fetch origin main
          git push origin HEAD:main
