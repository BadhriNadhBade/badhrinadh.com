title:            Badhri Nadh
description:      Badhri Nadh's home page on the World Wide Web.
url:              https://badhrinadh.com
permalink:        /posts/:title
timezone:         America/Chicago
sass:
  sass_dir: assets
  style: :compressed
collections:
  notes:
    output: true
  pages:
    output: true
# Each kind of content gets its own window layout, set here rather than in every
# file's front matter — a new post or note needs no `layout:` line at all. Pages
# at the repo root (colophon.md, accessibility-statement.md) aren't in a
# collection, so they name `layout: page` themselves.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: notes
    values:
      layout: note
  # Scoped by path, not `type: pages`: in Jekyll 3 that type also matches every
  # root-level Page, which would wrap assets/desk.js (a Page, because of its
  # front matter) and the feeds in the full HTML window layout.
  - scope:
      path: "_pages"
    values:
      layout: page
# Ships with the github-pages gem but is off by default, so it has to be named
# here. Generates redirect pages at build time from `redirect_from` front
# matter — see index.html, which absorbs the URLs of the removed photo gallery.
plugins:
  - jekyll-redirect-from
  # Also ships with github-pages and off by default. Generates /sitemap.xml;
  # the Sitemap: line in robots.txt is appended by .github/workflows/robots.yml,
  # since that file is overwritten wholesale from upstream every week.
  - jekyll-sitemap
i18n:
  en-US:
    accessibility: Accessibility statement
    source: View source
    colophon: Colophon
    now: Now
# Read only by the Classic layout (_layouts/default.html), which is restored
# verbatim from the old theme and rebuilt under /classic/ by
# _plugins/classic.rb. That layout shows its OpenHeart like button whenever
# this is anything other than "" — and Liquid's `!= ""` is true for nil too,
# so deleting the key would switch the button ON, pointing at nothing. It has
# to stay here, set to exactly "", for Classic's like button to stay off.
# Desk doesn't read it.
open_heart_endpoint: ""

markdown: CommonMarkGhPages
commonmark:
  options: ["UNSAFE", "HARDBREAKS"]
  extensions: ["strikethrough", "autolink", "table"]
exclude:
  - README.md
  - start
  - Gemfile
  - Gemfile.lock
  - vendor
  # Build-time checks run by .github/workflows/pages.yml, not part of the site.
  - script
